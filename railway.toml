[build]
builder = "railpack"
buildCommand = "python -m pip install --upgrade pip && python -m pip install -r sar-colorization-app/requirements-backend.txt && python scripts/download_checkpoints.py"

[deploy]
startCommand = "uvicorn backend:app --app-dir sar-colorization-app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
